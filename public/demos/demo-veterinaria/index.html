<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema para veterinarias · Demo de Figuriz, Tandil</title>
<meta name="description" content="Demo para veterinarias: ficha de cada mascota, recordatorio de vacunas, aviso de reposición de alimento y agenda de consultas y peluquería.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://figuriz.com/demos/demo-veterinaria">
<meta property="og:title" content="Fichas, vacunas y alimento · Demo">
<meta property="og:description" content="Demo para veterinarias: ficha de cada mascota, recordatorio de vacunas, aviso de reposición de alimento y agenda de consultas y peluquería.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2f8;--card:#ffffff;--ink:#241b33;--mu:#655b74;--line:#e6e0ee;
--brand:#3d2c5c;--brand-ink:#f6f2fb;--accent:#ff8a5b;--accent-ink:#ffffff;--accent-soft:#ffe3d7;
--ok:#28825a;--ok-soft:#dcf0e6;--warn:#b26d0a;--warn-soft:#fcecd3;--bad:#c2413f;--bad-soft:#f9dfde;--info:#3b62a5;--info-soft:#e0e8f6;
--fd:"Fredoka",system-ui,sans-serif;--fb:"Nunito",system-ui,sans-serif}
.pet{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:var(--accent-soft)}
.vac{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.peso{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:6px}
.peso div{flex:1;background:var(--brand);border-radius:4px 4px 0 0;opacity:.85;position:relative}
.peso div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--mu);font-weight:800}
.tipo{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px}
.t-cons{background:var(--info-soft);color:var(--info)}.t-vac{background:var(--ok-soft);color:var(--ok)}.t-pelu{background:var(--accent-soft);color:#b4502a}
.hora{font:600 16px var(--fd);min-width:48px}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
h1,h2,h3,.num,.fd{font-family:var(--fd)}
h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-size:18px;font-weight:700;margin:0}
h3{font-size:16px;font-weight:700;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--mu)}
.sm{font-size:13px}

/* header */
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--brand);display:flex;align-items:center;justify-content:center;font:800 17px var(--fd);flex:none}
.brand b{font:800 18px/1.05 var(--fd);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:12px;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--accent);color:var(--brand);padding:4px 8px;border-radius:99px;flex:none}
.reset{font-size:12.5px;opacity:.8;text-decoration:underline;text-underline-offset:3px;flex:none}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mu);position:relative;min-width:0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.nav .badge{position:absolute;top:7px;left:calc(50% + 5px);background:var(--bad);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center}
@media(min-width:860px){
  body{padding-bottom:0}
  .nav{position:sticky;top:56px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px}
  .nav button{flex:none;flex-direction:row;height:48px;padding:0 18px;font-size:14px;gap:8px}
  .nav button.on::before{top:auto;bottom:0;left:14px;right:14px;border-radius:3px 3px 0 0}
  .nav .badge{position:static}
}
main{max-width:1120px;margin:0 auto;padding:16px 16px 28px}

/* dolores */
.pains{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:16px;position:relative}
.pains b.t{display:block;font:700 15px var(--fd);margin-bottom:6px;padding-right:24px}
.pains ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13.5px}
.pains li{display:flex;gap:8px}
.pains li i{font-style:normal;flex:none}
.pains .x{position:absolute;top:8px;right:10px;font-size:20px;opacity:.5;padding:2px 6px}
.para{display:inline-block;margin:0 0 10px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--ink);padding:4px 10px;border-radius:99px}

/* comunes */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head .sub{color:var(--mu);font-size:14px;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip b{margin-left:5px;opacity:.65}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn-p{background:var(--brand);color:var(--brand-ink)}
.btn-a{background:var(--accent);color:var(--accent-ink)}
.btn-g{border:1px solid var(--line);background:var(--card)}
.btn-ok{background:var(--ok);color:#fff}
.btn-s{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.w100{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mu{background:var(--line);color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:12px 14px}
.kpi small{font-size:12px;color:var(--mu);display:block}
.kpi .num{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:3px}
.kpi.hl{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kpi.hl small{color:inherit;opacity:.75}
.kpi.bad .num{color:var(--bad)}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mu)}
.row .r{text-align:right;flex:none}
button.row:active{background:var(--line)}
.amt{font:800 15.5px var(--fd);white-space:nowrap}
.stack{display:grid;gap:14px}
.g2{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr;align-items:start}.g2 .span{grid-column:1/-1}}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 6px}
.empty{padding:26px;text-align:center;color:var(--mu)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.ok{background:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl .r{text-align:right;white-space:nowrap}
.scrollx{overflow-x:auto}
.note{font-size:12.5px;color:var(--mu);margin-top:8px}

/* formularios */
.form{display:grid;gap:12px}
.fld{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--mu)}
.fld input,.fld select,.fld textarea{font-size:15px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
@media(min-width:700px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.sheet{border-radius:18px}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h .x{font-size:24px;line-height:1;opacity:.55;padding:2px 6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .btn{flex:1}
.wa{background:#e7f8ec;border:1px solid #bfe8cb;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:14px;white-space:pre-wrap;color:#1b3a24}
.okline{display:flex;align-items:center;gap:8px;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.okline svg,.pains svg{width:18px;height:18px;flex:none}

/* toast */
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-16px);opacity:0;z-index:80;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:.25s;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--accent)}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:var(--accent-soft)}}
@media(min-width:860px){.pad .acts .btn{flex:0 1 auto}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<nav class="nav" id="nav"></nav>
<main id="app"></main>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>
<script>/* Base común de las demos (Figuriz · Tandil). Cada demo define APP y llama D.start(APP). */
const D = (() => {
  const fmt0 = new Intl.NumberFormat('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 });
  const fmtN = new Intl.NumberFormat('es-AR', { maximumFractionDigits:1 });
  const ICONS = {
    box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
    truck:'<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
    cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v5M18 9.5v5"/>',
    users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.8.3 5 2.7 5 5.8"/>',
    cal:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
    wrench:'<path d="M14.5 6.5a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8-1.5-1.5a4 4 0 0 1-5-5L13 2z" transform="translate(-1 0)"/>',
    list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
    chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
    home:'<path d="M3 11 12 3l9 8"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
    file:'<path d="M6 2.5h9l4 4V21.5H6z"/><path d="M14.5 2.5v4.5H19M9 12h7M9 16h7"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    key:'<circle cx="8" cy="15" r="4.5"/><path d="M11.5 12 21 2.5M17 6.5l3 3M15 8.5l2 2"/>',
    door:'<path d="M5 21V3h11v18M3 21h18"/><circle cx="13" cy="12" r="1"/>',
    flame:'<path d="M12 22c4 0 7-2.8 7-7 0-3.5-2.5-6.5-4-8 0 2.5-1.5 4-3 4.5C12 8 10.5 4.5 8 2c.5 3-3 6-3 11 0 5 3 9 7 9z"/>',
    pulse:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',
    bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    car:'<path d="M3 16v-4l2.5-5.5h13L21 12v4z"/><path d="M3 12h18"/><circle cx="7" cy="16.5" r="1.8"/><circle cx="17" cy="16.5" r="1.8"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
    search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
    wa:'<path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2.2-1.6-2.6-2.6l.8-1-1-2z"/>'
  };
  const icon = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;

  const qs = new URLSearchParams(location.search);
  const PARA = (qs.get('para') || '').trim().slice(0, 60);

  let APP, UI = { tab:null }, handlers = {}, inputs = {};
  const st = { S:null };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
  const money = n => fmt0.format(Math.round(n || 0));
  const num = n => fmtN.format(n || 0);
  const pad = (n, l = 2) => String(n).padStart(l, '0');
  const day0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const today = () => day0(new Date());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const key = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
  const fromKey = k => { const [y, m, dd] = k.split('-').map(Number); return new Date(y, m - 1, dd); };
  const diffDays = (a, b) => Math.round((day0(a) - day0(b)) / 864e5);
  const asDate = d => typeof d === 'string' && /^\d{4}-\d\d-\d\d$/.test(d) ? fromKey(d) : new Date(d);
  const fdate = (d, o = { day:'2-digit', month:'2-digit' }) => asDate(d).toLocaleDateString('es-AR', o);
  const flong = d => asDate(d).toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
  const fshort = d => asDate(d).toLocaleDateString('es-AR', { weekday:'short', day:'numeric' }).replace('.', '');
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = (r, a) => a[Math.floor(r() * a.length)];

  function save(){ try { localStorage.setItem(APP.key, JSON.stringify(st.S)); } catch(e) {} }
  function load(){
    let s = null;
    try { s = JSON.parse(localStorage.getItem(APP.key)); } catch(e) {}
    if (!s || s._v !== APP.version) { s = APP.seed(); s._v = APP.version; }
    st.S = s;
  }

  let tt;
  function toast(h){ const t = document.getElementById('toast'); t.innerHTML = h; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3400); }
  function modal(title, body, foot = ''){
    document.getElementById('modal').innerHTML = `<div class="modal" data-act="_bg"><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sheet-h"><h2>${title}</h2><button class="x" data-act="_close" aria-label="Cerrar">×</button></div>${body}${foot ? `<div class="acts">${foot}</div>` : ''}</div></div>`;
  }
  function close(){ document.getElementById('modal').innerHTML = ''; }
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const nval = id => parseFloat(val(id).replace(/\./g, '').replace(',', '.')) || 0;
  function waPreview(title, text, okMsg){
    modal(title, `<p class="muted sm" style="margin:0 0 8px">Así le llega por WhatsApp:</p><div class="wa">${esc(text)}</div>`,
      `<button class="btn btn-g" data-act="_close">Cancelar</button><button class="btn btn-ok" data-act="_waSent" data-v="${esc(okMsg || 'Mensaje enviado (simulado)')}">${icon('wa')} Enviar</button>`);
  }

  function brandName(){ return PARA || APP.brand.name; }
  function renderNav(){
    document.getElementById('nav').innerHTML = APP.tabs.map(([id, label, ic]) => {
      const b = APP.badges && APP.badges[id] ? APP.badges[id]() : 0;
      return `<button class="${UI.tab === id ? 'on' : ''}" data-act="_tab" data-v="${id}">${icon(ic)}<span>${label}</span>${b ? `<span class="badge">${b}</span>` : ''}</button>`;
    }).join('');
  }
  function painsHtml(){
    if (st.S._painsOff) return '';
    return `<div class="pains"><b class="t">${esc(APP.pains.title)}</b><ul>${APP.pains.items.map(p => `<li><i>✕</i><span>${p}</span></li>`).join('')}</ul><div class="sm" style="margin-top:8px;font-weight:600">${APP.pains.fix}</div><button class="x" data-act="_pains" aria-label="Ocultar">×</button></div>`;
  }
  function render(){
    renderNav();
    const v = APP.views[UI.tab];
    document.getElementById('app').innerHTML = (PARA ? `<span class="para">Demo preparada para ${esc(PARA)} · datos de ejemplo</span>` : '') + painsHtml() + v();
    if (APP.after) APP.after();
  }
  function header(){
    const n = brandName();
    document.getElementById('top').innerHTML = `<div class="top-in"><div class="brand"><span class="logo">${esc(n.trim()[0] || 'D').toUpperCase()}</span><div><b>${esc(n)}</b><small>${esc(APP.brand.sub)}</small></div></div><span class="tag">Demo</span><button class="reset" data-act="_reset">Reiniciar</button></div>`;
    document.title = `${n} · ${APP.brand.title} (demo)`;
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act, v = el.dataset.v;
    if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
    if (a === '_bg'){ if (e.target === el) close(); return; }
    if (a === '_close'){ close(); return; }
    if (a === '_tab'){ UI.tab = v; close(); window.scrollTo(0, 0); render(); return; }
    if (a === '_pains'){ st.S._painsOff = true; save(); render(); return; }
    if (a === '_waSent'){ close(); toast(esc(v)); if (APP.onWaSent) APP.onWaSent(); return; }
    if (a === '_reset'){ if (!confirm('¿Reiniciar la demo con los datos de ejemplo?')) return; try { localStorage.removeItem(APP.key); } catch(_) {} load(); UI.tab = APP.tabs[0][0]; close(); render(); return; }
    if (handlers[a]){ handlers[a](v, el, e); }
  });
  document.addEventListener('input', e => { const k = e.target.dataset.in; if (k && inputs[k]) inputs[k](e.target.value, e.target); });
  document.addEventListener('change', e => { const k = e.target.dataset.ch; if (k && handlers[k]) handlers[k](e.target.value, e.target); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  function start(app){
    APP = app; UI.tab = app.tabs[0][0];
    load(); header(); render();
  }
  return {
    start, render, save, toast, modal, close, val, nval, waPreview, icon, esc, money, num, pad,
    today, addDays, key, fromKey, diffDays, fdate, flong, fshort, rng, pick, day0, brandName,
    on:(a, f) => { handlers[a] = f; }, onInput:(k, f) => { inputs[k] = f; },
    get S(){ return st.S; }, UI, PARA
  };
})();
</script>
<script>
const T = () => D.today();
const k = n => D.key(D.addDays(T(), n));
const ICO = { Perro:'🐶', Gato:'🐱' };
const APP = {
  key:'demo-vet-v1', version:1,
  brand:{ name:'Veterinaria Patitas', sub:'Clínica y pet shop · Tandil', title:'Veterinaria' },
  pains:{ title:'¿Te pasa esto?', items:[
    'Las fichas están en papel o en un Excel, y la historia de cada animal se pierde.',
    'Nadie avisa cuándo toca la próxima vacuna, y el dueño se olvida.',
    'El alimento lo terminan comprando en el súper porque nadie les avisó.',
    'Consultas y peluquería se anotan en el mismo cuaderno.'],
    fix:'Así se ve con cada mascota y cada cliente en un solo lugar:' },
  tabs:[['hoy','Hoy','cal'],['pac','Pacientes','search'],['vac','Vacunas','bell'],['ali','Alimento','box']],
  badges:{ vac:() => D.S.pets.filter(p => p.vac.some(v => D.diffDays(D.fromKey(v.prox), T()) <= 7 && !v.av)).length, ali:() => D.S.ali.filter(a => quedan(a) <= 4 && !a.av).length },
  seed(){
    const pets = [
      { id:1, n:'Toby', esp:'Perro', raza:'Caniche', edad:'7 años', dueño:'Marta Giménez', tel:'249 15 451-2201', pesos:[6.8, 7.1, 7.4, 7.9], vac:[{ v:'Séxtuple', f:k(-350), prox:k(15) },{ v:'Antirrábica', f:k(-362), prox:k(3) }], hist:[[k(-40),'Control. Leve sobrepeso: cambio a alimento light.'],[k(-210),'Limpieza dental.']] },
      { id:2, n:'Luna', esp:'Gato', raza:'Común europeo', edad:'3 años', dueño:'Javier Costa', tel:'249 15 466-8812', pesos:[3.9, 4.0, 4.1, 4.1], vac:[{ v:'Triple felina', f:k(-370), prox:k(-5) },{ v:'Antirrábica', f:k(-370), prox:k(-5) }], hist:[[k(-370),'Vacunación anual.']] },
      { id:3, n:'Rocco', esp:'Perro', raza:'Labrador', edad:'2 años', dueño:'Familia Ruiz', tel:'249 15 437-0090', pesos:[28.5, 30.2, 31.0, 31.4], vac:[{ v:'Séxtuple', f:k(-300), prox:k(65) },{ v:'Antirrábica', f:k(-300), prox:k(65) }], hist:[[k(-12),'Otitis. Gotas por 7 días. Control en 10 días.']] },
      { id:4, n:'Mora', esp:'Perro', raza:'Border collie', edad:'5 años', dueño:'Lucía Herrera', tel:'249 15 409-3345', pesos:[17.2, 17.0, 17.4, 17.3], vac:[{ v:'Séxtuple', f:k(-358), prox:k(7) },{ v:'Antirrábica', f:k(-170), prox:k(195) }], hist:[[k(-90),'Castración. Evolución normal.']] },
      { id:5, n:'Simba', esp:'Gato', raza:'Siamés', edad:'9 años', dueño:'Raúl Domínguez', tel:'249 15 420-7711', pesos:[5.2, 5.0, 4.8, 4.6], vac:[{ v:'Triple felina', f:k(-200), prox:k(165) }], hist:[[k(-20),'Bajó de peso. Análisis de sangre pedido.'],[k(-200),'Vacunación anual.']] },
      { id:6, n:'Olivia', esp:'Perro', raza:'Bulldog francés', edad:'1 año', dueño:'Camila Paz', tel:'249 15 468-5502', pesos:[9.1, 10.4, 11.2, 11.8], vac:[{ v:'Séxtuple (refuerzo)', f:k(-28), prox:k(2) }], hist:[[k(-28),'Primera dosis refuerzo. Desparasitación.']] }
    ];
    const ali = [
      { id:1, pet:1, prod:'Alimento light razas pequeñas 7,5 kg', dias:45, ult:k(-42) },
      { id:2, pet:3, prod:'Alimento adulto razas grandes 15 kg', dias:30, ult:k(-27) },
      { id:3, pet:2, prod:'Alimento gato castrado 7,5 kg', dias:60, ult:k(-30) },
      { id:4, pet:4, prod:'Alimento adulto 15 kg', dias:45, ult:k(-44) },
      { id:5, pet:6, prod:'Alimento cachorro razas medianas 10 kg', dias:35, ult:k(-20) }
    ];
    const tur = [['9:30',3,'cons','Control otitis'],['10:00',6,'vac','Refuerzo séxtuple'],['11:00',4,'pelu','Baño y corte'],['12:30',5,'cons','Resultado de análisis'],['16:00',1,'vac','Antirrábica'],['17:00',null,'pelu','Libre']];
    return { pets, ali, tur:tur.map(([h, p, t, d], i) => ({ id:i + 1, h, p, t, d, ok:false })) };
  },
  views:{}
};
const pet = id => D.S.pets.find(p => p.id == id);
const quedan = a => a.dias - D.diffDays(T(), D.fromKey(a.ult));
const TL = { cons:['Consulta','t-cons'], vac:['Vacuna','t-vac'], pelu:['Peluquería','t-pelu'] };

/* ---------- Hoy ---------- */
APP.views.hoy = () => `<div class="head"><div><h1>Hoy</h1><div class="sub">${D.flong(T()).replace(/^./, c => c.toUpperCase())}</div></div></div>
  <div class="kpis"><div class="card kpi hl"><small>Turnos</small><span class="num">${D.S.tur.filter(t => t.p).length}</span></div><div class="card kpi"><small>Vacunas a vencer (7 días)</small><span class="num">${D.S.pets.filter(p => p.vac.some(v => D.diffDays(D.fromKey(v.prox), T()) <= 7)).length}</span></div>
    <div class="card kpi"><small>Alimento por terminarse</small><span class="num">${D.S.ali.filter(a => quedan(a) <= 4).length}</span></div><div class="card kpi"><small>Mascotas registradas</small><span class="num">${D.S.pets.length}</span></div></div>
  <section class="card list">${D.S.tur.map(t => { const p = t.p && pet(t.p); return `<div class="row"><span class="hora">${t.h}</span>${p ? `<span class="pet">${ICO[p.esp]}</span>` : ''}<div class="g"><div class="t">${p ? `${p.n} <span class="muted" style="font-weight:600">· ${D.esc(p.dueño)}</span>` : '<i class="muted">Libre</i>'}</div><div class="s"><span class="tipo ${TL[t.t][1]}">${TL[t.t][0]}</span> ${D.esc(t.d)}</div></div>
    <div class="r">${p ? (t.ok ? '<span class="pill p-ok">Atendido</span>' : `<button class="btn btn-g btn-s" data-act="ficha" data-v="${p.id}">Ficha</button>`) : ''}</div></div>`; }).join('')}</section>`;

/* ---------- Pacientes ---------- */
let qp = '';
APP.views.pac = () => `<div class="head"><div><h1>Pacientes</h1><div class="sub">Buscá por nombre de la mascota o del dueño</div></div></div>
  <label class="fld" style="margin-bottom:12px"><input data-in="qp" placeholder="Ej: Toby, Herrera…" value="${D.esc(qp)}" autocomplete="off"></label>
  <section class="card list" id="pl">${pacList()}</section>`;
function pacList(){ const s = qp.trim().toLowerCase(); return D.S.pets.filter(p => !s || (p.n + ' ' + p.dueño + ' ' + p.raza).toLowerCase().includes(s)).map(p => `<button class="row" data-act="ficha" data-v="${p.id}"><span class="pet">${ICO[p.esp]}</span><div class="g"><div class="t">${p.n}</div><div class="s">${p.raza} · ${p.edad} · ${D.esc(p.dueño)}</div></div></button>`).join('') || '<div class="empty">Sin resultados</div>'; }
D.onInput('qp', v => { qp = v; document.getElementById('pl').innerHTML = pacList(); });
D.on('ficha', id => {
  const p = pet(id), mx = Math.max(...p.pesos), mn = Math.min(...p.pesos);
  D.modal(`${ICO[p.esp]} ${p.n}`, `<div class="sm muted" style="margin:-6px 0 10px">${p.esp} · ${p.raza} · ${p.edad}<br>${D.esc(p.dueño)} · ${p.tel}</div>
    <h3>Peso (últimos controles)</h3><div class="peso" style="margin-top:20px">${p.pesos.map(w => `<div style="height:${30 + 70 * (w - mn) / ((mx - mn) || 1)}%"><span>${String(w).replace('.', ',')}</span></div>`).join('')}</div>
    <h3 style="margin:14px 0 4px">Vacunas</h3>${p.vac.map(v => { const d = D.diffDays(D.fromKey(v.prox), T()); return `<div class="vac"><span>${v.v}<br><small class="muted">Aplicada ${D.fdate(v.f, { day:'2-digit', month:'2-digit', year:'numeric' })}</small></span><span class="pill ${d < 0 ? 'p-bad' : d <= 15 ? 'p-warn' : 'p-ok'}">${d < 0 ? 'Vencida' : `Próxima ${D.fdate(v.prox)}`}</span></div>`; }).join('')}
    <h3 style="margin:14px 0 4px">Historia clínica</h3>${p.hist.map(([f, t]) => `<div class="vac"><span>${D.esc(t)}</span><small class="muted" style="white-space:nowrap">${D.fdate(f)}</small></div>`).join('')}`,
    `<button class="btn btn-g" data-act="_close">Cerrar</button><button class="btn btn-p" data-act="nota" data-v="${p.id}">Agregar consulta</button>`);
});
D.on('nota', id => {
  D.modal('Nueva consulta', `<div class="form"><label class="fld">Observaciones<textarea id="nt" rows="3">Control general. Todo en orden.</textarea></label><label class="fld">Peso (kg)<input id="nw" inputmode="decimal" value="${String(pet(id).pesos.slice(-1)[0]).replace('.', ',')}"></label></div>`,
    `<button class="btn btn-g" data-act="_close">Cancelar</button><button class="btn btn-p" data-act="notaOk" data-v="${id}">Guardar</button>`);
});
D.on('notaOk', id => { const p = pet(id); p.hist.unshift([D.key(T()), D.val('nt')]); const w = parseFloat(D.val('nw').replace(',', '.')); if (w) p.pesos = [...p.pesos.slice(-5), w]; const t = D.S.tur.find(x => x.p == id); if (t) t.ok = true; D.save(); D.render(); D.toast(`Consulta guardada en la ficha de <b>${p.n}</b>`); D.close(); });

/* ---------- Vacunas ---------- */
APP.views.vac = () => {
  const ls = []; D.S.pets.forEach(p => p.vac.forEach((v, i) => { const d = D.diffDays(D.fromKey(v.prox), T()); if (d <= 30) ls.push({ p, v, i, d }); }));
  ls.sort((a, b) => a.d - b.d);
  return `<div class="head"><div><h1>Vacunas</h1><div class="sub">Vencidas y próximas 30 días. Un mensaje y vuelven a vacunar con vos.</div></div>${ls.some(x => !x.v.av) ? `<button class="btn btn-a" data-act="vacTodos">${D.icon('wa')} Avisar a todos</button>` : ''}</div>
  <section class="card list">${ls.map(({ p, v, i, d }) => `<div class="row"><span class="pet">${ICO[p.esp]}</span><div class="g"><div class="t">${p.n} · ${v.v}</div><div class="s">${D.esc(p.dueño)} · ${d < 0 ? `venció hace ${-d} días` : d === 0 ? 'vence hoy' : `vence en ${d} días`}</div></div>
    <div class="r">${v.av ? '<span class="pill p-ok">Avisado</span>' : `<button class="btn btn-g btn-s" data-act="vac1" data-v="${p.id}:${i}">${D.icon('wa')} Avisar</button>`}</div></div>`).join('')}</section>`;
};
D.on('vac1', v => { const [id, i] = v.split(':'), p = pet(id), x = p.vac[i], d = D.diffDays(D.fromKey(x.prox), T());
  D.waPreview('Recordatorio de vacuna', `¡Hola ${p.dueño.split(' ')[0]}! 🐾 Te escribimos de ${D.brandName()}: a ${p.n} ${d < 0 ? 'ya le tocaba' : 'le toca'} la vacuna ${x.v} ${d < 0 ? `(venció el ${D.fdate(x.prox)})` : `el ${D.fdate(x.prox)}`}. ¿Te reservamos un turno? Tenemos lugar esta semana.`, 'Recordatorio enviado');
  APP.onWaSent = () => { x.av = true; D.save(); D.render(); APP.onWaSent = null; }; });
D.on('vacTodos', () => { D.S.pets.forEach(p => p.vac.forEach(v => { if (D.diffDays(D.fromKey(v.prox), T()) <= 30) v.av = true; })); D.save(); D.render(); D.toast('Recordatorios enviados (simulado)'); });

/* ---------- Alimento ---------- */
APP.views.ali = () => {
  const ls = D.S.ali.map(a => ({ a, q:quedan(a), p:pet(a.pet) })).sort((x, y) => x.q - y.q);
  return `<div class="head"><div><h1>Alimento</h1><div class="sub">Calculamos cuándo se le termina la bolsa a cada cliente y le avisamos antes</div></div></div>
  <section class="card list">${ls.map(({ a, q, p }) => `<div class="row"><span class="pet">${ICO[p.esp]}</span><div class="g"><div class="t">${p.n} · ${D.esc(p.dueño)}</div><div class="s">${D.esc(a.prod)} · dura ~${a.dias} días</div>
    <div class="bar" style="margin-top:6px"><i class="${q <= 4 ? 'bad' : q <= 10 ? 'warn' : 'ok'}" style="width:${Math.max(4, q / a.dias * 100)}%"></i></div></div>
    <div class="r"><div class="sm" style="font-weight:800;color:${q <= 4 ? 'var(--bad)' : 'inherit'}">${q <= 0 ? 'Se terminó' : `${q} días`}</div>${a.av ? '<span class="pill p-ok">Avisado</span>' : q <= 10 ? `<button class="btn btn-a btn-s" data-act="ali1" data-v="${a.id}" style="margin-top:4px">${D.icon('wa')} Ofrecer</button>` : ''}</div></div>`).join('')}</section>
  <div class="note">Con cada compra se recalcula. Es plata que hoy se va al súper o al pet shop de al lado.</div>`;
};
D.on('ali1', id => { const a = D.S.ali.find(x => x.id == id), p = pet(a.pet);
  D.waPreview('Ofrecer reposición', `¡Hola ${p.dueño.split(' ')[0]}! A ${p.n} se le estaría terminando el ${a.prod.toLowerCase()} 🐾 ¿Te lo preparamos? Te lo llevamos a domicilio sin cargo o lo pasás a buscar.`, 'Oferta enviada');
  APP.onWaSent = () => { a.av = true; D.save(); D.render(); APP.onWaSent = null; }; });

D.start(APP);
</script>
</body>
