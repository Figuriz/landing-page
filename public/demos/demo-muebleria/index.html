<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema para mueblerías y tiendas de deco · Demo de Figuriz</title>
<meta name="description" content="Demo para mueblerías y tiendas de deco: stock por color y medida en el local y en depósito, pedidos de WhatsApp e Instagram con seña y saldo, encargos a fábrica con aviso de atrasos y agenda de entregas.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://figuriz.com/demos/demo-muebleria">
<meta property="og:title" content="Stock, señas, encargos y entregas · Demo">
<meta property="og:description" content="Demo para mueblerías y tiendas de deco: stock por color y medida en el local y en depósito, pedidos de WhatsApp e Instagram con seña y saldo, encargos a fábrica con aviso de atrasos y agenda de entregas.">
<meta property="og:image" content="https://figuriz.com/og/demo/demo-muebleria">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://figuriz.com/demos/demo-muebleria">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee6;--card:#fffdf9;--ink:#2a2420;--mu:#6d625a;--line:#e6ddd1;
--brand:#33402f;--brand-ink:#f6f1e7;--accent:#c2603a;--accent-ink:#ffffff;--accent-soft:#f6e1d6;
--ok:#3a7a4a;--ok-soft:#e1efe3;--warn:#a5661a;--warn-soft:#f8ebd6;--bad:#b83a2e;--bad-soft:#f7e0dc;--info:#3b6589;--info-soft:#e1eaf2;
--fd:"Fraunces",Georgia,serif;--fb:"Outfit",system-ui,sans-serif}
body h1{font-size:29px;font-weight:700;letter-spacing:-.015em}
body .kpi .num{font-size:22px;font-weight:700}
body .amt{font-weight:700}
.srch{position:relative;margin-bottom:10px}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mu)}
.big-in{width:100%;font-size:16px;padding:13px 14px 13px 42px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.big-in:focus{border-color:var(--brand)}
.sug{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--mu)}
.sug button{border:1px dashed var(--line);border-radius:99px;padding:4px 10px;background:var(--card);color:var(--ink);font-size:12.5px}
.ans{background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:12px}
.ans b{color:#fff}
.prod{display:flex;gap:12px;padding:12px}
.ph{width:48px;height:48px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ph svg{width:28px;height:28px}
@media(min-width:700px){.ph{width:68px;height:68px}.ph svg{width:36px;height:36px}}
.prod .g{flex:1;min-width:0}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cod{font-size:12px;color:var(--mu)}
.var{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:1px 8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.vars{margin-top:8px}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.vn{font-weight:600;font-size:14px;min-width:0}
.vs{grid-column:2;font-size:12.5px;color:var(--mu)}
.vs b{color:var(--ink)}
.vr{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.rl{margin-left:2px}
@media(max-width:599px){.vr{grid-row:1;flex-direction:row;align-items:center}.vs{grid-column:2/4}.rl{display:none}.vr .btn-s{padding:6px 8px}}
.msg{background:#e7f8ec;border-radius:12px 12px 12px 3px;padding:9px 11px;font-size:14px;color:#1b3a24}
.p-ig{background:#f6e0ea;color:#a3305f}
.its{font-size:13.5px;margin-top:8px;display:grid;gap:3px}
.its div{display:flex;justify-content:space-between;gap:10px}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.m3 small,.tl small{display:block;font-size:11px;color:var(--mu)}
.m3 .amt{font-size:15px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tl div{background:var(--bg);border-radius:9px;padding:7px 9px;min-width:0}
.tl b{font:700 15px var(--fd)}
.tl .late{background:var(--bad-soft)}
.tl .late b,.tl .late small{color:var(--bad)}
.alert{font-size:13px;font-weight:600;color:var(--bad);margin-top:8px}
.day{margin-bottom:14px}
.day h3{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.turno{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:10px 14px 4px;display:flex;justify-content:space-between}
.cap{display:inline-flex;gap:3px}.cap i{width:10px;height:10px;border-radius:3px;background:var(--line)}.cap i.on{background:var(--accent)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink)}
.chk input{width:18px;height:18px}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
h1,h2,h3,.num,.fd{font-family:var(--fd)}
h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-size:18px;font-weight:700;margin:0}
h3{font-size:16px;font-weight:700;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--mu)}
.sm{font-size:13px}

/* header */
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;z-index:20}
.top-in{max-width:1120px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--brand);display:flex;align-items:center;justify-content:center;font:800 17px var(--fd);flex:none}
.brand b{font:800 18px/1.05 var(--fd);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:12px;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--accent);color:var(--brand);padding:4px 8px;border-radius:99px;flex:none}
.reset{font-size:12.5px;opacity:.8;text-decoration:underline;text-underline-offset:3px;flex:none}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mu);position:relative;min-width:0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.nav .badge{position:absolute;top:7px;left:calc(50% + 5px);background:var(--bad);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center}
@media(min-width:860px){
  body{padding-bottom:0}
  .nav{position:sticky;top:56px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px}
  .nav button{flex:none;flex-direction:row;height:48px;padding:0 18px;font-size:14px;gap:8px}
  .nav button.on::before{top:auto;bottom:0;left:14px;right:14px;border-radius:3px 3px 0 0}
  .nav .badge{position:static}
}
main{max-width:1120px;margin:0 auto;padding:16px 16px 28px}

/* dolores */
.pains{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:16px;position:relative}
.pains b.t{display:block;font:700 15px var(--fd);margin-bottom:6px;padding-right:24px}
.pains ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13.5px}
.pains li{display:flex;gap:8px}
.pains li i{font-style:normal;flex:none}
.pains .x{position:absolute;top:8px;right:10px;font-size:20px;opacity:.5;padding:2px 6px}
.para{display:inline-block;margin:0 0 10px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--ink);padding:4px 10px;border-radius:99px}

/* comunes */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head .sub{color:var(--mu);font-size:14px;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip b{margin-left:5px;opacity:.65}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn-p{background:var(--brand);color:var(--brand-ink)}
.btn-a{background:var(--accent);color:var(--accent-ink)}
.btn-g{border:1px solid var(--line);background:var(--card)}
.btn-ok{background:var(--ok);color:#fff}
.btn-s{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.w100{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mu{background:var(--line);color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:12px 14px}
.kpi small{font-size:12px;color:var(--mu);display:block}
.kpi .num{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:3px}
.kpi.hl{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kpi.hl small{color:inherit;opacity:.75}
.kpi.bad .num{color:var(--bad)}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mu)}
.row .r{text-align:right;flex:none}
button.row:active{background:var(--line)}
.amt{font:800 15.5px var(--fd);white-space:nowrap}
.stack{display:grid;gap:14px}
.g2{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr;align-items:start}.g2 .span{grid-column:1/-1}}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 6px}
.empty{padding:26px;text-align:center;color:var(--mu)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.ok{background:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl .r{text-align:right;white-space:nowrap}
.scrollx{overflow-x:auto}
.note{font-size:12.5px;color:var(--mu);margin-top:8px}

/* formularios */
.form{display:grid;gap:12px}
.fld{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--mu)}
.fld input,.fld select,.fld textarea{font-size:15px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
@media(min-width:700px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.sheet{border-radius:18px}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h .x{font-size:24px;line-height:1;opacity:.55;padding:2px 6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .btn{flex:1}
.wa{background:#e7f8ec;border:1px solid #bfe8cb;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:14px;white-space:pre-wrap;color:#1b3a24}
.okline{display:flex;align-items:center;gap:8px;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.okline svg,.pains svg{width:18px;height:18px;flex:none}

/* toast */
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-16px);opacity:0;z-index:80;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:.25s;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--accent)}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:var(--accent-soft)}}
@media(min-width:860px){.pad .acts .btn{flex:0 1 auto}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<nav class="nav" id="nav"></nav>
<main id="app"></main>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>
<script>/* Base común de las demos (Figuriz). Cada demo define APP y llama D.start(APP). */
const D = (() => {
  const fmt0 = new Intl.NumberFormat('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 });
  const fmtN = new Intl.NumberFormat('es-AR', { maximumFractionDigits:1 });
  const ICONS = {
    box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
    truck:'<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
    cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v5M18 9.5v5"/>',
    users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.8.3 5 2.7 5 5.8"/>',
    cal:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
    wrench:'<path d="M14.5 6.5a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8-1.5-1.5a4 4 0 0 1-5-5L13 2z" transform="translate(-1 0)"/>',
    list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
    chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
    home:'<path d="M3 11 12 3l9 8"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
    file:'<path d="M6 2.5h9l4 4V21.5H6z"/><path d="M14.5 2.5v4.5H19M9 12h7M9 16h7"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    key:'<circle cx="8" cy="15" r="4.5"/><path d="M11.5 12 21 2.5M17 6.5l3 3M15 8.5l2 2"/>',
    door:'<path d="M5 21V3h11v18M3 21h18"/><circle cx="13" cy="12" r="1"/>',
    flame:'<path d="M12 22c4 0 7-2.8 7-7 0-3.5-2.5-6.5-4-8 0 2.5-1.5 4-3 4.5C12 8 10.5 4.5 8 2c.5 3-3 6-3 11 0 5 3 9 7 9z"/>',
    pulse:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',
    bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    car:'<path d="M3 16v-4l2.5-5.5h13L21 12v4z"/><path d="M3 12h18"/><circle cx="7" cy="16.5" r="1.8"/><circle cx="17" cy="16.5" r="1.8"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
    search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
    wa:'<path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2.2-1.6-2.6-2.6l.8-1-1-2z"/>'
  };
  const icon = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;

  const qs = new URLSearchParams(location.search);
  const PARA = (qs.get('para') || '').trim().slice(0, 60);

  let APP, UI = { tab:null }, handlers = {}, inputs = {};
  const st = { S:null };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
  const money = n => fmt0.format(Math.round(n || 0));
  const num = n => fmtN.format(n || 0);
  const pad = (n, l = 2) => String(n).padStart(l, '0');
  const day0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const today = () => day0(new Date());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const key = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
  const fromKey = k => { const [y, m, dd] = k.split('-').map(Number); return new Date(y, m - 1, dd); };
  const diffDays = (a, b) => Math.round((day0(a) - day0(b)) / 864e5);
  const asDate = d => typeof d === 'string' && /^\d{4}-\d\d-\d\d$/.test(d) ? fromKey(d) : new Date(d);
  const fdate = (d, o = { day:'2-digit', month:'2-digit' }) => asDate(d).toLocaleDateString('es-AR', o);
  const flong = d => asDate(d).toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
  const fshort = d => asDate(d).toLocaleDateString('es-AR', { weekday:'short', day:'numeric' }).replace('.', '');

/* ---------- Pedidos ---------- */
let fPed = 'abiertos';
APP.views.ped = () => {
  const ps = D.S.ped.slice().sort((a, b) => b.id - a.id);
  const abiertos = ps.filter(p => p.est !== 'entregado');
  const cons = D.S.cons.filter(c => !c.ok);
  const mes = D.key(T()).slice(0, 7);
  const list = fPed === 'abiertos' ? abiertos : fPed === 'saldo' ? ps.filter(p => saldo(p) > 0) : ps;
  const estP = p => p.est === 'fabrica' ? ['En fábrica','p-warn'] : p.est === 'entregar' ? ['Para entregar','p-info'] : ['Entregado','p-ok'];
  return `<div class="head"><div><h1>Pedidos</h1><div class="sub">Lo que entra por WhatsApp, Instagram y el local, con su seña y su saldo</div></div></div>
  <div class="kpis">
    <div class="card kpi hl"><small>Saldos a cobrar</small><span class="num">${D.money(ps.reduce((s, p) => s + saldo(p), 0))}</span></div>

    <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;align-items:center"><b>${D.esc(c.nom)}</b><span>${canalPill(c.canal)} <span class="sm muted">${c.h}</span></span></div>
    <div class="msg">${D.esc(c.txt)}</div>
    <div class="sm" style="margin-top:8px;color:var(--info);font-weight:600">${vn(c.sug)}: ${D.S.st[c.sug].l} en el local · ${D.S.st[c.sug].d} en depósito · ${D.money(V[c.sug].p)}</div>
    <div class="acts" style="margin-top:10px"><button class="btn btn-g btn-s" data-act="resp" data-v="${c.sug}">${D.icon('wa')} Responder</button><button class="btn btn-a btn-s" data-act="armar" data-v="${c.id}">${D.icon('plus')} Armar pedido con seña</button></div></article>`).join('')}</div>` : ''}
  <div class="chips" style="margin-bottom:12px">${[['abiertos','Abiertos'],['saldo','Con saldo'],['todos','Todos']].map(([k, l]) => `<button class="chip ${fPed === k ? 'on' : ''}" data-act="fPed" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="stack">${list.map(p => { const [l, c] = estP(p), tot = total(p), sl = saldo(p); return `<article class="card pad">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><b>${D.esc(p.cli)}</b><div class="sm muted">#${p.id} · ${D.fdate(p.f)}</div></div><div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${canalPill(p.canal)}<span class="pill ${c}">${l}</span></div></div>
    <div class="its">${p.items.map(([k, n]) => `<div><span>${n > 1 ? n + ' × ' : ''}${p.nota || vn(k)}</span></div>`).join('')}</div>
    <div class="m3"><div><small>Total</small><span class="amt">${D.money(tot)}</span></div><div><small>Pagado</small><span class="amt" style="color:var(--ok)">${D.money(pagado(p))}</span></div><div><small>Saldo</small><span class="amt" style="color:${sl ? 'var(--bad)' : 'var(--ok)'}">${D.money(sl)}</span></div></div>
    <div class="bar" style="margin-top:8px"><i class="ok" style="width:${Math.min(100, pagado(p) / tot * 100)}%"></i></div>
    <div class="sm muted" style="margin-top:6px">${sl ? (p.cuotas ? `Saldo en ${p.cuotas} cuotas de ${D.money(cuota(p))} · pagó ${cuotasPag(p)} de ${p.cuotas}` : 'Saldo contra entrega') : 'Pagado completo'}</div>
    ${sl ? `<div class="acts" style="margin-top:10px"><button class="btn btn-g btn-s" data-act="recordar" data-v="${p.id}">${D.icon('wa')} Mandar saldo</button><button class="btn btn-p btn-s" data-act="pago" data-v="${p.id}">Registrar pago</button></div>` : ''}</article>`; }).join('') || '<div class="card empty">No hay pedidos con este filtro</div>'}</div>`;
};
D.on('fPed', v => { fPed = v; D.render(); });
D.on('recordar', id => {
  const p = ped(id), sl = saldo(p);
  D.waPreview('Mandar saldo', `¡Hola ${nom1(p.cli)}! Te escribimos de ${D.brandName()} por tu pedido #${p.id}.\nTotal: ${D.money(total(p))}\nYa pagaste: ${D.money(pagado(p))}\n${p.cuotas ? `Te queda la cuota ${cuotasPag(p) + 1} de ${p.cuotas}: ${D.money(Math.min(sl, cuota(p)))}` : `Saldo a pagar al recibir: ${D.money(sl)}`}\nPodés pagar por transferencia o en efectivo. ¡Gracias!`, 'Saldo enviado');
});
D.on('pago', id => {
  const p = ped(id), sl = saldo(p), sug = p.cuotas ? Math.min(sl, cuota(p)) : sl;
  D.modal('Registrar pago', `<div class="form"><div class="sm muted">${D.esc(p.cli)} · #${p.id} · saldo ${D.money(sl)}</div>
    <div class="f2"><label class="fld">Monto<input id="pg-m" inputmode="numeric" value="${sug}"></label><label class="fld">Medio<select id="pg-t"><option>Transferencia</option><option>Efectivo</option><option>Débito</option><option>Crédito</option></select></label></div>
    ${p.cuotas ? `<div class="note">Cuota ${cuotasPag(p) + 1} de ${p.cuotas}.</div>` : ''}</div>`,
    `<button class="btn btn-g" data-act="_close">Cancelar</button><button class="btn btn-ok" data-act="pagoOk" data-v="${id}">Guardar y mandar recibo</button>`);
});
D.on('pagoOk', id => {
  const p = ped(id), m = D.nval('pg-m'); if (m <= 0) return;
  p.pagos.push({ f:D.key(T()), m, medio:D.val('pg-t'), t:p.cuotas ? 'Cuota' : 'Saldo' }); D.save(); D.close(); D.render();
  D.toast(`Pago de <b>${D.money(m)}</b> registrado · recibo enviado`);
});
D.on('armar', id => {
  const c = D.S.cons.find(x => x.id == id), k = c.sug;
  const opts = PR.map(p => `<optgroup label="${p.n}">${p.vs.map(v => `<option value="${v.k}" ${v.k === k ? 'selected' : ''}>${v.v} · ${D.money(v.p)} · ${D.S.st[v.k].l + D.S.st[v.k].d ? `hay ${D.S.st[v.k].l + D.S.st[v.k].d}` : 'a pedido'}</option>`).join('')}</optgroup>`).join('');
  D.modal('Armar pedido', `<div class="form"><label class="fld">Cliente<input id="np-c" value="${D.esc(c.nom)}"></label>
    <label class="fld">Producto<select id="np-v" data-ch="npVar">${opts}</select></label>
    <div class="f2"><label class="fld">Cantidad<input id="np-q" inputmode="numeric" value="1" data-ch="npVar"></label><label class="fld">Seña recibida<input id="np-s" inputmode="numeric" value="${Math.round(V[k].p * .3 / 1000) * 1000}"></label></div>
    <label class="fld">Saldo<select id="np-cu"><option value="0">Contra entrega</option><option value="3">En 3 cuotas</option><option value="6">En 6 cuotas</option></select></label>
    <div class="f2"><label class="fld">Entrega<select id="np-e"><option value="1">Mañana</option><option value="2">Pasado mañana</option><option value="3">En 3 días</option><option value="r">Retira en el local</option></select></label><label class="fld">Franja<select id="np-fr"><option>9 a 13</option><option>14 a 18</option></select></label></div>
    <label class="fld">Dirección<input id="np-d" value="San Martín 742"></label>
    <label class="chk"><input type="checkbox" id="np-a" checked> Hay que armarlo en la casa</label>
    <div class="note" id="np-disp"></div></div>`,
    `<button class="btn btn-g" data-act="_close">Cancelar</button><button class="btn btn-a" data-act="armarOk" data-v="${id}">Guardar pedido</button>`);
  npDisp();
});
function npDisp(){
  const k = D.val('np-v'), n = Math.max(1, D.nval('np-q')), s = D.S.st[k];
  document.getElementById('np-disp').innerHTML = s.l + s.d >= n
    ? `Hay ${s.l} en el local y ${s.d} en depósito: se reserva y se descuenta del stock.`
    : `<b style="color:var(--warn)">No alcanza el stock:</b> queda como encargo a ${V[k].pr.pv}, con fecha prometida al cliente.`;
}
D.on('npVar', () => { const k = D.val('np-v'), n = Math.max(1, D.nval('np-q')); document.getElementById('np-s').value = Math.round(V[k].p * n * .3 / 1000) * 1000; npDisp(); });
D.on('armarOk', id => {
  const c = D.S.cons.find(x => x.id == id), k = D.val('np-v'), n = Math.max(1, Math.round(D.nval('np-q'))), s = D.S.st[k];
  const cli = D.val('np-c') || 'Cliente', sn = D.nval('np-s'), cu = +D.val('np-cu'), e = D.val('np-e'), dir = D.val('np-d'), fr = D.val('np-fr');
  const encargo = s.l + s.d < n;
  const p = { id:D.S.next++, cli, canal:c.canal, f:D.key(T()), items:[[k, n]], pagos:sn > 0 ? [{ f:D.key(T()), m:sn, medio:'Transferencia', t:'Seña' }] : [], cuotas:cu, est:encargo ? 'fabrica' : 'entregar', dir };
  D.S.ped.push(p);
  const fc = D.addDays(T(), 30);
  if (encargo){
    D.S.enc.push({ id:D.S.nextEnc++, pid:p.id, cli, det:`${n > 1 ? n + ' × ' : ''}${vn(k)}`, pv:V[k].pr.pv, fp:D.key(T()), fc:D.key(fc), fprov:D.key(D.addDays(T(), 26)), est:'fabrica' });
  } else {
    let r = n; const fromD = Math.min(s.d, r); s.d -= fromD; r -= fromD; s.l -= r;
    s.s30 += n; s.ult = 0;
    if (e !== 'r') D.S.ent.push({ id:D.S.nextE++, pid:p.id, f:D.key(D.addDays(T(), +e)), fr, cli, dir, det:`${n > 1 ? n + ' × ' : ''}${vn(k)}`, armar:document.getElementById('np-a').checked, flete:'Camioneta propia', est:'pend' });
  }
  c.ok = true; D.save(); D.close(); D.render();
  const sl = saldo(p);
  D.waPreview(`Pedido #${p.id}`, `¡Gracias ${nom1(cli)}! Te confirmo el pedido en ${D.brandName()}:\n• ${n > 1 ? n + ' × ' : ''}${vn(k)}\nTotal: ${D.money(total(p))}\nSeña recibida: ${D.money(sn)}\nSaldo: ${D.money(sl)}${cu ? ` en ${cu} cuotas de ${D.money(cuota(p))}` : ' al recibir'}\n${encargo ? `Lo encargamos a fábrica: te lo entregamos antes del ${D.fdate(fc)} y te avisamos cualquier novedad.` : e === 'r' ? 'Te esperamos en el local para retirarlo.' : `Entrega: ${D.flong(D.addDays(T(), +e))} de ${fr} h en ${dir}.`}`, `Pedido #${p.id} confirmado al cliente`);
});

/* ---------- Encargos ---------- */
function encEstado(e){
  if (e.est === 'llego') return ['Llegó', 'p-ok', false];
  const dp = D.diffDays(D.fromKey(e.fprov), T());
  if (dp < 0) return [`Proveedor atrasado ${-dp} día${dp === -1 ? '' : 's'}`, 'p-bad', true];
  if (e.fc && e.fprov > e.fc) return ['Llega después de lo prometido', 'p-bad', true];
  if (dp <= 7) return [dp === 0 ? 'Llega hoy' : `Llega en ${dp} día${dp === 1 ? '' : 's'}`, 'p-info', false];
  return ['En fecha', 'p-ok', false];
}
APP.views.enc = () => {
  const es = D.S.enc.slice().sort((a, b) => (encEstado(b)[2] - encEstado(a)[2]) || (a.fprov < b.fprov ? -1 : 1));
  const abiertos = es.filter(e => e.est !== 'llego');
  const seniaFab = abiertos.filter(e => e.pid).reduce((s, e) => s + sena(ped(e.pid)), 0);
  return `<div class="head"><div><h1>Encargos a fábrica</h1><div class="sub">Lo que le prometiste al cliente al lado de lo que te dijo el proveedor</div></div></div>
  <div class="kpis">
    <div class="card kpi hl"><small>En fábrica</small><span class="num">${abiertos.length}</span></div>
    <div class="card kpi ${abiertos.some(e => encEstado(e)[2]) ? 'bad' : ''}"><small>Con atraso</small><span class="num">${abiertos.filter(e => encEstado(e)[2]).length}</span></div>
    <div class="card kpi"><small>Llegan esta semana</small><span class="num">${abiertos.filter(e => { const d = D.diffDays(D.fromKey(e.fprov), T()); return d >= 0 && d <= 7; }).length}</span></div>
    <div class="card kpi"><small>Señas cobradas de encargos</small><span class="num">${D.money(seniaFab)}</span></div>
  </div>
  <div class="stack">${es.map(e => { const [l, c, bad] = encEstado(e), p = e.pid && ped(e.pid); const late = e.fc && e.fprov > e.fc; return `<article class="card pad">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><b>${e.cli ? D.esc(e.cli) : 'Reposición para el local'}</b><div class="sm">${D.esc(e.det)}</div><div class="sm muted">${D.esc(e.pv)}${p ? ` · pedido #${p.id} · seña ${D.money(sena(p))}` : ''}</div></div><span class="pill ${c}">${l}</span></div>
    <div class="tl"><div><small>Encargado</small><b>${D.fdate(e.fp)}</b></div><div class="${D.diffDays(D.fromKey(e.fprov), T()) < 0 && e.est !== 'llego' || late ? 'late' : ''}"><small>Dice el proveedor</small><b>${D.fdate(e.fprov)}</b></div><div><small>Prometido al cliente</small><b>${e.fc ? D.fdate(e.fc) : '—'}</b></div></div>
    ${e.est !== 'llego' && late ? `<div class="alert">⚠ El proveedor entrega ${D.diffDays(D.fromKey(e.fprov), D.fromKey(e.fc))} días después de lo que le dijiste al cliente. Avisale antes de que pregunte.</div>` : ''}
    ${e.est !== 'llego' && D.diffDays(D.fromKey(e.fprov), T()) < 0 ? `<div class="alert">⚠ Ya tendría que haber llegado. Reclamale al proveedor${e.cli ? ' y avisale al cliente' : ''}.</div>` : ''}
    ${e.est === 'llego' ? `<div class="sm" style="margin-top:8px;color:var(--ok);font-weight:600">${e.cli ? 'Pasó a Entregas para coordinar con el cliente.' : 'Sumado al stock del depósito.'}</div>` : `<div class="acts" style="margin-top:10px">
      <button class="btn btn-g btn-s" data-act="reclamar" data-v="${e.id}">${D.icon('wa')} ${e.reclamado ? 'Reclamado · volver a escribir' : 'Consultar al proveedor'}</button>
      ${e.cli ? `<button class="btn btn-g btn-s" data-act="avisarCli" data-v="${e.id}">${D.icon('wa')} Avisar al cliente</button>` : ''}
      <button class="btn btn-p btn-s" data-act="llego" data-v="${e.id}">${D.icon('check')} Llegó</button></div>`}
  </article>`; }).join('')}</div>`;
};
D.on('reclamar', id => {
  const e = D.S.enc.find(x => x.id == id), dp = D.diffDays(D.fromKey(e.fprov), T());
  D.waPreview(`Mensaje a ${e.pv}`, `Hola! Les escribo de ${D.brandName()} por el encargo del ${D.fdate(e.fp)}: ${e.det}.\n${dp < 0 ? `Nos habían dicho que estaba para el ${D.fdate(e.fprov)} y todavía no llegó.` : `Nos dijeron ${D.fdate(e.fprov)}.`}${e.fc ? ` El cliente lo espera para el ${D.fdate(e.fc)}.` : ''}\n¿Me confirman cuándo sale? Gracias!`, 'Mensaje enviado al proveedor');

D.on('avisarCli', id => {
  const e = D.S.enc.find(x => x.id == id), late = e.fprov > e.fc;
  const nueva = D.addDays(D.fromKey(e.fprov > D.key(T()) ? e.fprov : D.key(D.addDays(T(), 5))), 2);
  D.waPreview('Avisar al cliente', late || e.fprov < D.key(T())
    ? `¡Hola ${nom1(e.cli)}! Te escribimos de ${D.brandName()} por tu ${e.det.split(' · ')[0].toLowerCase()}. La fábrica nos avisó una demora: en vez del ${D.fdate(e.fc)} lo estaríamos entregando cerca del ${D.fdate(nueva)}. Te pedimos disculpas, te avisamos apenas llegue al depósito para coordinar.`
    : `¡Hola ${nom1(e.cli)}! Te escribimos de ${D.brandName()}: tu ${e.det.split(' · ')[0].toLowerCase()} viene en fecha. Llega al depósito alrededor del ${D.fdate(e.fprov)} y te escribimos para coordinar la entrega.`, 'Cliente avisado');
});
D.on('llego', id => {
  const e = D.S.enc.find(x => x.id == id); e.est = 'llego';
  if (e.rep){ D.S.st[e.rep[0]].d += e.rep[1]; D.save(); D.render(); D.toast(`<b>${e.rep[1]} unidades</b> sumadas al depósito`); return; }

/* ---------- Entregas ---------- */
const cobrar = e => { const p = e.pid && ped(e.pid); return p && !p.cuotas ? saldo(p) : 0; };
APP.views.ent = () => {
  const dias = [0, 1, 2, 3].map(n => D.addDays(T(), n)), CAP = 3;

    <section class="card list">${['9 a 13','14 a 18'].map(fr => { const x = es.filter(e => e.fr === fr); return `<div class="turno"><span>${fr} h</span><span class="cap" title="Lugar en la camioneta">${Array.from({ length:CAP }, (_, k) => `<i class="${k < x.length ? 'on' : ''}"></i>`).join('')}</span></div>
      ${x.map(e => { const cb = cobrar(e); return `<div class="row"><div class="g"><div class="t">${D.esc(e.cli)}</div><div class="s">${D.esc(e.dir)} · ${D.esc(e.det)}</div>
        <div class="tags">${e.armar ? '<span class="pill p-warn">Hay que armar</span>' : ''}${cb && e.est === 'pend' ? `<span class="pill p-bad">Cobrar ${D.money(cb)}</span>` : ''}<span class="pill p-mu">${D.esc(e.flete)}</span></div>${e.nota ? `<div class="s" style="margin-top:4px">📝 ${D.esc(e.nota)}</div>` : ''}</div>
        <div class="r">${e.est === 'entregada' ? '<span class="pill p-ok">Entregada</span>' : `<button class="btn btn-g btn-s" data-act="avisar" data-v="${e.id}" aria-label="Avisar al cliente">${D.icon('wa')}</button> <button class="btn btn-ok btn-s" data-act="entregada" data-v="${e.id}" aria-label="Marcar entregada">${D.icon('check')}</button>`}</div></div>`; }).join('') || '<div class="row"><span class="s muted">Libre</span></div>'}`; }).join('')}</section></div>`; }).join('')}`;
};
D.on('avisar', id => {
  const e = D.S.ent.find(x => x.id == id), cb = cobrar(e);
  D.waPreview('Avisar al cliente', `¡Hola ${nom1(e.cli)}! Te escribimos de ${D.brandName()}: tu pedido (${e.det}) llega ${e.f === D.key(T()) ? 'hoy' : D.flong(e.f)} entre las ${e.fr.replace(' a ', ' y las ')} h a ${e.dir}.${e.armar ? ' Lo armamos en el lugar, calculá unos 40 minutos.' : ''}${cb ? `\nSaldo a pagar al recibir: ${D.money(cb)}.` : ''}\n¿Va a haber alguien para recibir?`, 'Aviso enviado');
});
D.on('entregada', id => {
  const e = D.S.ent.find(x => x.id == id), cb = cobrar(e), p = e.pid && ped(e.pid);
  e.est = 'entregada';
  if (p){ if (cb) p.pagos.push({ f:D.key(T()), m:cb, medio:'Contra entrega', t:'Saldo' }); p.est = 'entregado'; }
  D.save(); D.render(); D.toast(cb ? `Entregada · saldo de <b>${D.money(cb)}</b> cobrado` : 'Entregada · el cliente recibe el aviso');
});

D.start(APP);
</script>
<script src="/demos/figuriz-cta.js" defer></script>
</body>
</html>
